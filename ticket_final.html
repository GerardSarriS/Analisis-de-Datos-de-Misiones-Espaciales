<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Una nit sota les estrelles — Jana</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap');
    :root{--gold:#c9a84c;--gold-dim:#9a7a38;--bg:#07090f;--card-bg:#0c0f1a;--border:rgba(201,168,76,.2);--text:#d4d8e8;--text-dim:rgba(212,216,232,.5);--text-muted:rgba(212,216,232,.35)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:var(--bg);color:var(--text);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 16px 60px;position:relative;overflow-x:hidden}
    #stars{position:fixed;inset:0;z-index:0;pointer-events:none}
    .wrap{position:relative;z-index:1;width:100%;max-width:560px;display:flex;flex-direction:column;gap:32px}
    .header{text-align:center}
    .header .eyebrow{font-size:.7rem;letter-spacing:5px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:14px}
    .header h1{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,6vw,3rem);font-weight:300;font-style:italic;color:var(--text);line-height:1.15}
    .header h1 span{color:var(--gold);font-style:normal;font-weight:400}
    .constellation{display:flex;justify-content:center;opacity:.6}
    .constellation svg{width:220px;height:80px;animation:twinkle 6s ease-in-out infinite}
    @keyframes twinkle{0%,100%{opacity:.6}50%{opacity:.9}}
    .ticket{border:1px solid var(--border);border-radius:4px;background:var(--card-bg);overflow:hidden}
    .ticket-top{padding:36px 40px 28px;border-bottom:1px solid var(--border)}
    .ticket-name{font-size:.65rem;letter-spacing:5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
    .ticket-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;color:var(--text)}
    .ticket-subtitle{font-size:.8rem;color:var(--text-dim);margin-top:4px}
    .divider-label{font-size:.6rem;letter-spacing:5px;text-transform:uppercase;color:var(--text-muted);margin:28px 0 20px}
    .fields{display:grid;grid-template-columns:1fr 1fr;gap:22px 32px}
    .field label{display:block;font-size:.58rem;letter-spacing:4px;text-transform:uppercase;color:var(--gold);opacity:.7;margin-bottom:5px}
    .field .val{font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:400;color:var(--text);line-height:1.3}
    .field .note{font-size:.72rem;color:var(--text-dim);margin-top:2px}
    .perf{display:flex;align-items:center}
    .perf-dot{width:20px;height:20px;background:var(--bg);border-radius:50%;flex-shrink:0;margin:0 -1px}
    .perf-line{flex:1;border-top:1px dashed var(--border)}
    .ticket-stub{padding:20px 40px;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .stub-ref{font-size:.58rem;letter-spacing:4px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}
    .stub-num{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--gold)}
    .stub-note{font-size:.68rem;color:var(--text-muted);text-align:right;line-height:1.6;max-width:220px}
    .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 28px;font-family:'Jost',sans-serif;font-size:.72rem;font-weight:400;letter-spacing:3px;text-transform:uppercase;border-radius:2px;cursor:pointer;text-decoration:none;transition:opacity .2s}
    .btn:hover{opacity:.75}
    .btn-primary{background:var(--gold);color:#07090f;border:none}
    .btn-secondary{background:transparent;color:var(--gold);border:1px solid var(--border)}
    .signature{text-align:center;font-family:'Cormorant Garamond',serif;font-size:1rem;font-style:italic;color:var(--text-dim)}
    .qr-real{width:80px;height:80px;border-radius:4px;flex-shrink:0}
    @media(max-width:480px){.ticket-top,.ticket-stub{padding:28px 24px}.fields{grid-template-columns:1fr}.ticket-stub{flex-direction:column;align-items:flex-start;gap:12px}.stub-note{text-align:left;max-width:100%}.actions{flex-direction:column}}
    @media print{body{background:white;color:#111;padding:20px}#stars,.actions,.signature,.eyebrow{display:none}:root{--bg:white;--card-bg:white;--text:#111;--text-dim:#666;--text-muted:#999;--border:rgba(0,0,0,.15);--gold:#9a6f2a}.ticket{border:1px solid #ddd}}
  </style>
</head>

  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;stars=[];const n=Math.floor(W*H/4000);for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.2,a:Math.random()*.7+.15,phase:Math.random()*Math.PI*2,freq:Math.random()*.003+.001})}
  function spawnShooter(){shooters.push({x:Math.random()*W*.6,y:Math.random()*H*.3,vx:6+Math.random()*4,vy:3+Math.random()*2,len:80+Math.random()*60,a:1})}
  function draw(ts){ctx.clearRect(0,0,W,H);stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(220,225,240,'+(s.a*(.5+.5*Math.sin(ts*s.freq+s.phase)))+')';ctx.fill()});shooters=shooters.filter(s=>s.a>.02);shooters.forEach(s=>{const g=ctx.createLinearGradient(s.x,s.y,s.x-s.len*.7,s.y-s.len*.35);g.addColorStop(0,'rgba(255,255,255,'+s.a+')');g.addColorStop(1,'rgba(255,255,255,0)');ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.len*.7,s.y-s.len*.35);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();s.x+=s.vx;s.y+=s.vy;s.a-=.02});requestAnimationFrame(draw)}
  window.addEventListener('resize',resize);resize();requestAnimationFrame(draw);setInterval(spawnShooter,5000);setTimeout(spawnShooter,1500);
</script>
</body>
